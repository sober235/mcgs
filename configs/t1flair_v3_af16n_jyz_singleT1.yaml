# ============================================================================
# t1flair_v3_af16n_jyz_singleT1.yaml -- jiangyizhou T1+FLAIR, noise study, nominal AF 16 (2026-09-16).
# Cloned from the diff-mask Gaussian configs; spec docs/superpowers/specs/2026-09-16-jyz-af16-noise-robustness-design.md.
# ONE thing differs from T1FLAIR_AF16_v3_jiangyizhou: the reconstruction fits data/meas_<c>.h5 = the clean k-space
# plus complex Gaussian noise with per-sample std 2 sigma0 (logs/make_noisy_kspace.json). data_path stays the CLEAN
# k-space (symlink into T1FLAIR_AF12_v3_jiangyizhou/data) and defines the ground truth and the scale only.
# Mask: the house vd-Poisson disc AF16 mask (symlink into T1FLAIR_AF16_v3_jiangyizhou/data, md5 d08179b8...), 2966 PE
# points, T1 15.19x. Recipe: the AF16 phase-3 recipe, frozen; its argument list lives in run_noise_mcgs.sh only.
# ============================================================================
data:
  plain:
    name: T1
    acceleration_factor: 16
    data_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/ksp_T1.h5
    measurement_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/meas_T1.h5
    csm_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/csm_espirit_T1.h5
    mask_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/mask_af16_3d.h5
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes:
    - 1
    - 2
    readout_axis: 0
    presampled: false
    skip_readout_check: false
  contrast:
    name: T1
    acceleration_factor: 16
    data_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/ksp_T1.h5
    measurement_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/meas_T1.h5
    csm_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/csm_espirit_T1.h5
    mask_path: /data0/congcong/code/GS/Results_20260908/T1FLAIR_AF16_noise2x_v3_jiangyizhou/data/mask_af16_3d.h5
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes:
    - 1
    - 2
    readout_axis: 0
    presampled: false
    skip_readout_check: false
gaussian:
  density_lr: 0.015
  init_scale: 0.008
  initial_num_points: 600000
  position_lr: 0.0003
  rotation_lr: 0.0003
  scale_lr: 0.002
hardware:
  device: cuda:0
loss:
  loss_type: l2
  tv_weight: 0.1
  tv_eps: 0.04
  kspace_freq_adaptive: true
  kspace_center_fraction: 0.05
  kspace_center_weight: 0.3
  kspace_mid_weight: 1.0
  kspace_high_weight: 2.2
  lambda_diff: 0.01
  lambda_enh: 0
  edge_tv: true
  edge_tv_kappa_q: 0.85
  edge_tv_wfloor: 0.1
mode:
  experimental_reproduction: false
  paper_faithful: false
  self_supervised_deploy: false
output:
  exp_name: t1flair_v3_af16n_single_T1
  output_dir: results_arc/t1flair_v3_af16n_single_T1
training:
  max_iterations: 4000
  shared_warmup_iters: 500
  eval_every: 1000
  log_every: 50
  save_every: 1000
  seed: 42
  max_grad_norm: 1.0
  lr_scheduler:
    type: exponential
    gamma: 0.9995
voxelizer:
  max_radius: 20
  tile_size: 8
