data:
  plain:
    name: T1
    acceleration_factor: 1   # dead field when mask_path is set (external mask short-circuits the
                              # internal generators that read it, and skip_readout_check disables
                              # the only validator that reads it too — see dataset.py L614/653/660/698);
                              # set to 1 here purely so a reader doesn't mistake this for an AF12 run
    data_path: /data1/data1_congcong/data/3D/T2_csm_ksp_n4_mat/Train_3dBrain_huangyuwei_20230705-160927-1451_161015_T1_trainer.mat
    csm_path: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/csm_espirit/csm_espirit_T1.mat
    mask_path: /data0/congcong/code/GS/Paired_ARC_GS_general_framework/configs/g0_mask_full_ones.mat
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes:
    - 0
    - 1
    readout_axis: 2
    presampled: false
    skip_readout_check: true
  contrast:
    name: FLAIR
    acceleration_factor: 1   # dead field — see plain.acceleration_factor comment above
    data_path: /data1/data1_congcong/data/3D/T2_csm_ksp_n4_mat/Train_3dBrain_huangyuwei_20230705-160927-1451_161015_FLAIR_trainer.mat
    csm_path: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/csm_espirit/csm_espirit_FLAIR.mat
    mask_path: /data0/congcong/code/GS/Paired_ARC_GS_general_framework/configs/g0_mask_full_ones.mat
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes:
    - 0
    - 1
    readout_axis: 2
    presampled: false
    skip_readout_check: true
gaussian:
  density_lr: 0.015
  init_scale: 0.008
  initial_num_points: 200000
  position_lr: 0.0003
  rotation_lr: 0.0003
  scale_lr: 0.002
hardware:
  device: cuda:0
loss:
  loss_type: l2
  tv_weight: 0.06
  kspace_freq_adaptive: true
  kspace_center_fraction: 0.05
  kspace_center_weight: 0.3
  kspace_mid_weight: 1.0
  kspace_high_weight: 2.2
  lambda_diff: 0.01
  lambda_enh: 0
mode:
  experimental_reproduction: false
  paper_faithful: false
  self_supervised_deploy: false
output:
  exp_name: g0_full
  output_dir: results_arc/g0_full
training:
  max_iterations: 4000
  shared_warmup_iters: 500
  eval_every: 1000
  log_every: 50
  save_every: 1000
  seed: 42
  max_grad_norm: 1.0
  lr_scheduler:
    type: exponential
    gamma: 0.9995
voxelizer:
  max_radius: 20
  tile_size: 8
