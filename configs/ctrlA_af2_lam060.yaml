# ============================================================================
# ctrlA_af2_lam060.yaml — control A REPAIR, arm 2 (lambda_geo scaled 6x: 0.10 -> 0.60)
# ----------------------------------------------------------------------------
# Control A originally used an all-ones (fully sampled) mask. Under hard-DC
# (k_dc = m*y + (1-m)*k_model), an all-ones mask sets (1-m)=0 everywhere, so the scored
# reconstruction is exactly the measured data handed back -- the model's output is discarded and
# the run is vacuous (see diag_artefact/controls.py::assert_control_is_not_vacuous, and its
# retrospective FAIL on results_arc/ctrlA_lam010_volumes.npz).
#
# Repair: MILD acceleration instead of full sampling, so hard-DC leaves a real null space for the
# model to fill while data is still far more plentiful than at AF=12. mask_path below points at
# ctrlA_af2_indep_seed1_ALIGNED.mat (target AF=2, achieved net_AF=2.075, gates in
# results_arc/diag_artefact/ctrlA_af2_mask_report.json), built by scripts/build_ctrl_mask.py --af 2.0.
#
# Two arms are mandatory (see task brief): AF=2 multiplies the measurement count ~6x vs AF=12,
# diluting TV's effective strength, so a single lambda would make "less patchiness with more
# data" a foregone conclusion. This arm scales lambda_geo by that same ~6x (0.10 -> 0.60,
# loss.tv_weight below); the sibling ctrlA_af2_lam010.yaml keeps lambda_geo at the working
# point's unscaled value (0.10). The verdict only counts if both arms agree in direction.
#
# Modeled on configs/ctrlB_seed1_aligned.yaml (external-mask pattern), NOT on the all-ones
# ctrlA_fullsample_edgetv_lam*.yaml configs.
# ============================================================================
data:
  plain:
    name: T1                       # <-- display/log label for the high-SNR guide channel
    acceleration_factor: 2
    data_path: /data1/data1_congcong/data/3D/T2_csm_ksp_n4_mat/Train_3dBrain_huangyuwei_20230705-160927-1451_161015_T1_trainer.mat
    csm_path:  /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/csm_espirit/csm_espirit_T1.mat
    mask_path: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/mask/ctrlA_af2_indep_seed1_ALIGNED.mat
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes: [0, 1]             # transverse PE plane (house convention)
    readout_axis: 2                # S-I fully sampled readout
    presampled: false
    skip_readout_check: true
  contrast:
    name: FLAIR                    # <-- display/log label for the guided channel
    acceleration_factor: 2
    data_path: /data1/data1_congcong/data/3D/T2_csm_ksp_n4_mat/Train_3dBrain_huangyuwei_20230705-160927-1451_161015_FLAIR_trainer.mat
    csm_path:  /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/csm_espirit/csm_espirit_FLAIR.mat
    mask_path: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/mask/ctrlA_af2_indep_seed1_ALIGNED.mat
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes: [0, 1]
    readout_axis: 2
    presampled: false
    skip_readout_check: true
gaussian:
  density_lr: 0.015
  init_scale: 0.008
  initial_num_points: 200000
  position_lr: 0.0003
  rotation_lr: 0.0003
  scale_lr: 0.002
  # warm-start checkpoint (dual-warm 576902 Gaussians). Large; bring-your-own.
  warm_start_checkpoint: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/results_dualwarm_v2_t1_flairTV5/checkpoints/latest.pth
hardware:
  device: cuda:0
loss:
  loss_type: l2
  tv_weight: 0.60                  # overridden by --lambda_geo 0.60 CLI arg
  kspace_freq_adaptive: true
  kspace_center_fraction: 0.05
  kspace_center_weight: 0.3
  kspace_mid_weight: 1.0
  kspace_high_weight: 2.2          # overridden by --kspace_high 2.2 CLI arg
  lambda_diff: 0.01                # ignored by v2 trainer (posterior replaces it)
  lambda_enh: 0                    # ignored by v2 trainer
  edge_tv: true                  # replace isotropic _tv_loss with edge-weighted TV
  edge_tv_kappa_q: 0.85          # overridden by --edge_tv_kappa_q 0.85 CLI arg
  edge_tv_wfloor: 0.1            # overridden by --edge_tv_wfloor 0.1 CLI arg
mode:
  experimental_reproduction: false
  paper_faithful: false
  self_supervised_deploy: false
output:
  exp_name: paired_winner_v2
  output_dir: results_winner_v2
training:
  max_iterations: 1500
  shared_warmup_iters: 500
  eval_every: 1000
  log_every: 50
  save_every: 1000
  seed: 42
  max_grad_norm: 1.0
  lr_scheduler:
    type: exponential
    gamma: 0.9995
voxelizer:
  max_radius: 20
  tile_size: 8
