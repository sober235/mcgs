# ============================================================================
# winner_v2_centered.yaml — winner_v2_aligned + DC-centering (algorithm-code alignment)
# ----------------------------------------------------------------------------
# Identical to winner_v2_aligned.yaml EXCEPT data.*.center_kspace_dc: true.
#
# The shipped data's k-space DC is offset ~+22px on PE axis1 (DC at index 132,
# array center 110). winner_v2_aligned compensates by rolling only the *mask* to
# the DC, which leaves (a) the array-centered frequency-adaptive loss weight
# miscentered and (b) an image-domain phase ramp (~0.71 rad/vox) that the complex
# Gaussians must absorb (constant per-primitive alpha under-represents a ramp that
# rotates ~a full cycle across a primitive's support). center_kspace_dc rolls the
# ksp AND the mask by the same shift so the DC lands on the array center:
#   - retained energy UNCHANGED (73.79% T1 / 89.28% FLAIR — physics untouched)
#   - |GT| UNCHANGED (a k-space roll is a pure image-domain phase modulation)
#   - phase ramp removed (0.71 -> 0.20 rad/vox), freq-weight correctly centered
# Hypothesis under test: removing the ramp lets the Gaussians represent structure
# (not phase) -> a modest, contrast-symmetric sharpness/PSNR gain. Does NOT change
# the AF=12 unsampled-high-freq limit. See project memory.md §6.
# ============================================================================
data:
  plain:
    name: T1                       # <-- display/log label for the high-SNR guide channel
    acceleration_factor: 12
    data_path: /data1/data1_congcong/data/3D/T2_csm_ksp_n4_mat/Train_3dBrain_huangyuwei_20230705-160927-1451_161015_T1_trainer.mat
    csm_path:  /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/csm_espirit/csm_espirit_T1.mat
    mask_path: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/mask/mask3d_vdpois_af12_transverse_ALIGNED.mat
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes: [0, 1]             # transverse PE plane (house convention)
    readout_axis: 2                # S-I fully sampled readout
    presampled: false
    skip_readout_check: true
    center_kspace_dc: true         # roll ksp+mask so k-space DC -> array center
  contrast:
    name: FLAIR                    # <-- display/log label for the guided channel
    acceleration_factor: 12
    data_path: /data1/data1_congcong/data/3D/T2_csm_ksp_n4_mat/Train_3dBrain_huangyuwei_20230705-160927-1451_161015_FLAIR_trainer.mat
    csm_path:  /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/csm_espirit/csm_espirit_FLAIR.mat
    mask_path: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/mask/mask3d_vdpois_af12_transverse_ALIGNED.mat
    mask_type: external
    normalization_percentile: 99.9
    normalize_kspace: true
    phase_axes: [0, 1]
    readout_axis: 2
    presampled: false
    skip_readout_check: true
    center_kspace_dc: true         # roll ksp+mask so k-space DC -> array center
gaussian:
  density_lr: 0.015
  init_scale: 0.008
  initial_num_points: 200000
  position_lr: 0.0003
  rotation_lr: 0.0003
  scale_lr: 0.002
  # warm-start checkpoint (dual-warm 576902 Gaussians). Large; bring-your-own.
  warm_start_checkpoint: /data0/congcong/code/GS/3DGS/GS_TMI/3DGS/3dgsVC/results_dualwarm_v2_t1_flairTV5/checkpoints/latest.pth
hardware:
  device: cuda:0
loss:
  loss_type: l2
  tv_weight: 0.06                  # PRIMARY anti-grain lever (sweet spot 0.05-0.06)
  kspace_freq_adaptive: true
  kspace_center_fraction: 0.05
  kspace_center_weight: 0.3
  kspace_mid_weight: 1.0
  kspace_high_weight: 2.2          # sharpness lever (opposes TV; 2.0-2.2)
  lambda_diff: 0.01                # ignored by v2 trainer (posterior replaces it)
  lambda_enh: 0                    # ignored by v2 trainer
mode:
  experimental_reproduction: false
  paper_faithful: false
  self_supervised_deploy: false
output:
  exp_name: paired_winner_v2_centered
  output_dir: results_winner_v2_centered
training:
  max_iterations: 4000
  shared_warmup_iters: 500
  eval_every: 1000
  log_every: 50
  save_every: 1000
  seed: 42
  max_grad_norm: 1.0
  lr_scheduler:
    type: exponential
    gamma: 0.9995
voxelizer:
  max_radius: 20
  tile_size: 8
